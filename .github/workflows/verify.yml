name: verify

# FluentFlyout × TaskbarLyrics 合并的前置门槛验证。
# 出处：DC1024/ff-lyrics-verify（P0 阶段迁入本仓，原仓归档）。
#
# 触发条件：
#   - 推送到 master 且触及歌词相关目录
#   - 任何 PR（不设 paths 过滤，原因见下）
#   - 手动触发（可指定是否跑 ARM64）
#
# pull_request 刻意不加 paths 过滤：
#   master 的 protect-master ruleset 把「J1 兼容性探针」「J2 Core 编译」
#   设为 required_status_checks。GitHub 的规则是「必需检查没产出 =
#   永远 pending = 永远 blocked」，所以一旦给 PR 加了 paths 过滤，
#   任何不匹配的 PR（例如只改 FluentFlyoutWPF/Pages/*.xaml）就会卡死。
#   这正是 PR #5 遇到的情况：只改了一个图标名，J1/J2 从未运行，
#   mergeable_state 一直是 blocked。
#   push 到 master 仍保留 paths，避免无关合并浪费 runner。
on:
  push:
    branches: [master]
    paths:
      - 'FluentFlyout.Lyrics/**'
      - 'FluentFlyout.Lyrics.Probe/**'
      - 'FluentFlyout.Lyrics.Probe.Render/**'
      - 'FluentFlyout.Lyrics.Probe.Screenshot/**'
      - 'FluentFlyout.Lyrics.Tests/**'
      - 'tools/EncryptedFixtureGen/**'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      run_arm64:
        description: '同时验证 ARM64'
        type: boolean
        default: true

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────
  # J1：兼容性探针 —— 判定门槛：9/9 全部 PASS，返回码 0
  # ─────────────────────────────────────────────────────────────
  probe:
    name: J1 兼容性探针
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        working-directory: FluentFlyout.Lyrics.Probe
        run: dotnet restore

      # -warnaserror 是硬门槛，不允许带警告通过
      - name: 编译（警告视为错误）
        working-directory: FluentFlyout.Lyrics.Probe
        run: dotnet build -c Release --no-restore -warnaserror

      # 程序返回码即判定结果：0=全通过，1=有失败
      - name: 执行探针
        working-directory: FluentFlyout.Lyrics.Probe
        run: dotnet run -c Release --no-build

      - name: 汇总到 Job Summary
        if: always()
        shell: pwsh
        run: |
          $json = Get-ChildItem -Recurse -Filter results.json -Path FluentFlyout.Lyrics.Probe/bin -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $json) { "未找到 results.json" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY; exit 0 }
          $data = Get-Content $json.FullName -Raw -Encoding utf8 | ConvertFrom-Json
          "| 编号 | 检查项 | 结果 | 详情 |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|"                 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          foreach ($r in $data) {
            $icon = if ($r.pass) { 'PASS' } else { 'FAIL' }
            "| $($r.id) | $($r.name) | $icon | $($r.detail) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: 归档结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-results
          path: FluentFlyout.Lyrics.Probe/bin/Release/**/results.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # J2：Core 编译门槛 —— 双 RID 证明 TL.Core 能在 FF 的 TFM 下编译
  # ─────────────────────────────────────────────────────────────
  core-migration:
    name: J2 Core 编译 (${{ matrix.rid }})
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arm64: false
          - rid: win-arm64
            arm64: true
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ARM64 在 PR 场景跳过以省时间；需要时手动触发
      - name: 判定是否跳过
        id: skip
        shell: pwsh
        run: |
          $skip = ('${{ matrix.arm64 }}' -eq 'true') -and ('${{ github.event_name }}' -eq 'pull_request')
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: 还原
        if: steps.skip.outputs.skip != 'true'
        working-directory: FluentFlyout.Lyrics
        run: dotnet restore -r ${{ matrix.rid }}

      - name: 编译 Core（警告视为错误）
        if: steps.skip.outputs.skip != 'true'
        working-directory: FluentFlyout.Lyrics
        run: dotnet build -c Release -r ${{ matrix.rid }} --no-restore -warnaserror

      # 依赖漏洞扫描：仅报告，不作为失败条件。
      # 上游新增 CVE 不应阻断与本次移植无关的 PR。
      - name: 依赖漏洞扫描（仅报告）
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: true
        working-directory: FluentFlyout.Lyrics
        run: dotnet list package --vulnerable --include-transitive 2>&1 | Tee-Object -FilePath vuln-${{ matrix.rid }}.log

      - name: 归档漏洞报告
        if: always() && steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vuln-${{ matrix.rid }}
          path: FluentFlyout.Lyrics/vuln-${{ matrix.rid }}.log
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # J3：单元测试 —— 629 个用例（318 移植 + 8 解密回归 + P2/P3 新增）
  # 这是 P1-9 的验收硬指标：全绿才算移植完成
  # ─────────────────────────────────────────────────────────────
  test:
    name: J3 单元测试
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 还原
        working-directory: FluentFlyout.Lyrics.Tests
        run: dotnet restore

      # -warnaserror 是硬门槛，但必须把这四个可空性警告码排除在外。
      #
      # 为什么需要豁免：P4 起 FluentFlyout.Lyrics.Tests 通过 ProjectReference
      # 引用主工程（配置迁移测试要反序列化真实的 UserSettings），
      # 于是主工程被一起编译，-warnaserror 会把它既有的 36 条可空性警告
      # 升级成编译错误，测试任务直接挂掉。这 36 条全部落在 P4 未改动的文件上：
      #   Visualizer.cs / OnboardingViewModel.cs / Notifications.cs /
      #   SystemPage.xaml.cs / HomePage.xaml.cs
      # 属于上游历史包袱，不该阻断歌词相关的 PR。
      #
      # 为什么用 WarningsNotAsErrors 而不是直接去掉 -warnaserror：
      # 去掉就等于放弃这道门禁。精确豁免这 4 个码之后，任何**新的**警告
      # （包括歌词代码自己引入的可空性问题）依旧会让编译失败。
      # 若上游把历史警告修净了，删掉这个属性即可恢复全量门禁。
      - name: 编译测试项目（警告视为错误）
        working-directory: FluentFlyout.Lyrics.Tests
        run: >
          dotnet build -c Release --no-restore -warnaserror
          "-p:WarningsNotAsErrors=CS8601%3BCS8602%3BCS8604%3BCS8629"

      # TestData 由 csproj 以 PreserveNewest 复制到输出目录，
      # 测试按 AppContext.BaseDirectory 相对路径读取，不依赖仓库布局。
      - name: 执行测试
        working-directory: FluentFlyout.Lyrics.Tests
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      # 把通过数写进 Job Summary，评审人不必下载 artifact
      - name: 汇总到 Job Summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter results.trx -Path FluentFlyout.Lyrics.Tests -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $trx) { "未找到 results.trx" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY; exit 0 }
          [xml]$doc = Get-Content $trx.FullName -Encoding utf8
          $c = $doc.TestRun.ResultSummary.Counters
          "| 总数 | 通过 | 失败 | 跳过 |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "|---|---|---|---|"              | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "| $($c.total) | $($c.passed) | $($c.failed) | $($c.notExecuted) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: 归档测试结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: FluentFlyout.Lyrics.Tests/**/results.trx
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # J4：视觉验收矩阵 —— 72 张 PNG（3 DPI × 2 主题 × 2 方向 × 6 状态）
  #
  # 为什么必须在 CI 跑：P3 结束时歌词层还没接线（SetLyricsMode /
  # UpdateLyricsFrame 在生产代码里没有调用点，真正的装配在 P4 的
  # LyricsService），真机播放截图这条路跑不通。这个探针用 mock 帧驱动
  # 真实 LyricsPanel，是当前唯一能覆盖渲染路径的自动化手段。
  #
  # 它抓过两个肉眼极难发现的生产缺陷：
  #   1. Canvas 在 Auto 行里塌成 0 高 → 主行文字被整行裁掉
  #   2. 估算只算主行 → 次要行溢出面板被裁
  # ─────────────────────────────────────────────────────────────
  screenshot:
    name: J4 视觉验收矩阵
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # 探针引用主工程以渲染真实 LyricsPanel，所以要一起编译。
      # 主工程本身有 36 条既有警告（基线），这里不加 -warnaserror。
      - name: 编译探针
        working-directory: FluentFlyout.Lyrics.Probe.Screenshot
        run: dotnet build -c Release

      # 退出码即判定结果：0=72 张全通过，1=有失败
      - name: 生成并校验截图矩阵
        working-directory: FluentFlyout.Lyrics.Probe.Screenshot
        run: dotnet run -c Release --no-build

      # 整机装配链：渲染真实的 TaskbarWidgetControl，面板的短边与主轴长度
      # 只能来自生产方法 CalculateSize（矩阵则是夹具直接写宽度）。
      #
      # 为什么单列一步：两类失败的修法完全不同——矩阵红 = 面板自身的排版
      # 或朝向坏了；这一步红 = 宿主把尺寸写错了。混在一个退出码里会互相掩盖。
      - name: 整机装配链（尺寸由 CalculateSize 写入）
        working-directory: FluentFlyout.Lyrics.Probe.Screenshot
        run: dotnet run -c Release --no-build -- --assembly

      # 四方向位置矩阵：底部/顶部/左/右 × 3 DPI × 深浅，24 张。
      #
      # 为什么单列一步：它验的是**位置**，不是排版。小组件被摆到任务栏外面时
      # 每张图里的歌词都清清楚楚，上面两步都可能全绿——只有「是否越界 /
      # 次轴是否居中 / 朝向对不对 / 主列贴哪半边」这几条判据抓得住。
      # 也是 Win11 上唯一能覆盖「左/右竖排」的自动化手段（摆不出竖向任务栏）。
      - name: 四方向位置矩阵（越界 / 居中 / 朝向 / 镜像）
        working-directory: FluentFlyout.Lyrics.Probe.Screenshot
        run: dotnet run -c Release --no-build -- --orientations

      # R1 卡顿护栏：模拟 60s 播放，数歌词路径请求了多少次整窗重排。
      #
      # 这条判据与像素无关，坏起来在截图上**完全看不出来**——小组件画得
      # 一模一样，只是每次换行都偷偷 SetWindowPos + UIA 查询一次。这类回归
      # 只能靠计数抓，所以单独一步、单独一个退出码。
      - name: R1 重排预算（60s 播放的请求次数）
        working-directory: FluentFlyout.Lyrics.Probe.Screenshot
        run: dotnet run -c Release --no-build -- --reposition

      # 把断言汇总写进 Job Summary，评审人不必下载 artifact
      - name: 汇总到 Job Summary
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'shots.log'
          # 重新跑一次拿输出（--no-build 很快），只为取断言文本
          Push-Location FluentFlyout.Lyrics.Probe.Screenshot
          dotnet run -c Release --no-build 2>&1 | Tee-Object -FilePath $log | Out-Null
          Pop-Location
          if (-not (Test-Path $log)) { exit 0 }
          $lines = Get-Content $log -Encoding utf8
          $fail = @($lines | Where-Object { $_ -match '^\[FAIL\]' })
          $pass = @($lines | Where-Object { $_ -match '^\[PASS\]' })
          "| 结果 | 数量 |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "|---|---|"        | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "| PASS | $($pass.Count) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "| FAIL | $($fail.Count) |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($fail.Count -gt 0) {
            "" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "**失败项：**" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $fail | ForEach-Object { "- ``$_``" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: 归档截图矩阵
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lyrics-screenshots
          path: |
            FluentFlyout.Lyrics.Probe.Screenshot/bin/Release/**/shots/*.png
            FluentFlyout.Lyrics.Probe.Screenshot/bin/Release/**/assembly/*.png
          if-no-files-found: warn
